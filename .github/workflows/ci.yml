name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go test -count=1 -v ./...

  # What ships: pure Go, no cgo, for both Windows architectures. The ARM64 one
  # cannot run on a hosted runner, so it is built and vetted.
  windows-builds:
    name: build windows/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      GOOS: windows
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: go vet ./...
      # `go install` names the binary after the last element of the package
      # path: building the way a user installs it must give authn-kinit.exe,
      # never kinit.exe (MIT/Heimdal kinit, MIT KfW, Java runtimes).
      - name: build as installed, and check the binary's name
        shell: bash
        run: |
          mkdir out
          go build -trimpath -o out/ ./cmd/authn-kinit
          ls out
          test -f out/authn-kinit.exe || { echo "::error::expected out/authn-kinit.exe"; exit 1; }
          test ! -e out/kinit.exe || { echo "::error::a binary named kinit.exe was built"; exit 1; }
          if go list -f '{{.Name}} {{.ImportPath}}' ./... | grep -E '^main ' | grep -v '/cmd/authn-kinit$'; then
            echo "::error::a main package outside cmd/authn-kinit"; exit 1
          fi

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: go test -race -count=1 ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
